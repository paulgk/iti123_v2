# MLflow Configuration for Badminton ML Project
tracking:
  # Tracking server URI (local file-based for now, upgrade to server later)
  tracking_uri: "file:./mlruns"

  # GCS-backed artifact store
  # Format: gs://bucket-name/mlflow/
  artifact_location: "gs://iti123-badminton-ml/mlflow/"

experiment:
  # Default experiment name pattern
  name_pattern: "badminton-{model_type}-{feature_version}"

  # Predefined experiments
  experiments:
    - name: "badminton-baseline"
      description: "Baseline models with v2 features (427 features)"
    - name: "badminton-enhanced"
      description: "Enhanced models with v3 features (expanded set)"

logging:
  # What to log automatically
  auto_log:
    - "hyperparameters"
    - "metrics"
    - "model_artifacts"

  # Metrics to track
  metrics:
    - "accuracy"
    - "f1_score"
    - "train_test_gap"
    - "loss"
